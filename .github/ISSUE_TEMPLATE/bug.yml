name: Bug report
description: Something in the harness, tests, or docs is broken.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: Reproduce command
      placeholder: uv run pytest tests/test_dagapeyeff.py -q
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS / Ubuntu, Python 3.12.x, uv version"
    validations:
      required: true
