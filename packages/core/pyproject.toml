[project]
name = "cipher-lab"
version = "0.1.0"
description = "Reproducible computational research infrastructure for historical ciphers, tachygraphy, and cryptograms"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alexander Katin" }]
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "scipy>=1.13.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cipher_lab"]
